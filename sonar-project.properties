sonar.projectKey=lalaba-merchant-app
sonar.projectName=LALABA · Merchant App (React Native)
sonar.projectVersion=1.0
# sonar.organization=YOUR_ORG_KEY  ← uncomment and set this only when using SonarCloud

sonar.sources=src,app
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage — generated by: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude from analysis entirely (not scanned at all)
sonar.exclusions=\
  **/node_modules/**,\
  **/android/**,\
  **/ios/**,\
  **/.expo/**,\
  **/build/**,\
  **/*.d.ts,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx

# Exclude from coverage metrics only (code quality still analyzed)
sonar.coverage.exclusions=\
  src/types/**,\
  src/theme/**,\
  src/styles/**,\
  src/data/**,\
  src/stubs/**,\
  src/config/firebase.ts,\
  src/config/graphql.ts,\
  app/_layout.tsx,\
  app/+not-found.tsx

sonar.scm.disabled=true
sonar.qualitygate.wait=false
