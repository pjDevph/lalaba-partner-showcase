# ─── P1: Branch Selection After Login ────────────────────────────────────────
# Gate: P1 — multi-branch merchants must pick a branch before using the POS;
#        a broken picker blocks all operations for those accounts.
# Tests: After login, if a branch selection screen is shown (BranchPickerView),
#        the first branch in the list can be selected and the app proceeds to
#        the main merchant tab bar.
# Context: BranchPickerView is a shared component used by POS, Services, and
#          Tasks. When a merchant has multiple branches the app routes them
#          through a picker before landing on the main UI.
#          (src/components/BranchPickerView.tsx)
# ──────────────────────────────────────────────────────────────────────────────

appId: com.lalaba.merchant.dev
---
# ── 1. Launch fresh and sign in ───────────────────────────────────────────────
- launchApp:
    clearState: true

- runFlow: .maestro/_helpers/login.yaml

# ── 2. Conditional: check whether the branch picker is present ────────────────
# Not all merchant accounts trigger the branch picker (single-branch merchants
# skip it). We use `optional: true` so the assertion does not fail the flow
# when the picker is absent.
#
# BranchPickerView renders a HeroHeader with the title prop passed by the
# caller (e.g., "Select a Branch" or similar). The subtitle defaults to
# "Select a branch" (BranchPickerView.tsx line 62).
- assertVisible:
    text: "Select a branch"
    optional: true

# ── 3. If a picker appeared, wait for branch list to load ─────────────────────
- waitForAnimationToEnd

# ── 4. Select the first branch in the list ───────────────────────────────────
# BranchPickerView renders branch rows as TouchableOpacity items. Each row
# contains the branch name (branchCardName style). Tapping index 0 selects
# the topmost branch regardless of its name — useful when branch names are
# dynamic (loaded from the API).
#
# If the picker was NOT shown (single-branch account), this tapOn will simply
# find nothing and Maestro will skip it (because the branch list is empty on
# the main POS screen). The subsequent assertions still validate a working state.
- tapOn:
    index: 0
    selector:
      id: "branch-picker-item"   # Accessibility hint — add testID="branch-picker-item" to branchCard TouchableOpacity for reliable targeting
    optional: true

# Fallback: if testID is not yet wired, match by the visible count hint text
# or by tapping the first item that appears below the search bar.
- waitForAnimationToEnd

# ── 5. Assert the app lands on the main merchant POS view ─────────────────────
# After branch selection (or if no picker appeared) the merchant should be on
# the main tab bar with the POS tab accessible.
- assertVisible:
    text: "POS"

# ── 6. Assert the POS sub-tabs are reachable (validates branch context loaded) -
- tapOn:
    text: "POS"
- waitForAnimationToEnd
- assertVisible:
    text: "Terminal"
- assertVisible:
    text: "Queue"
- assertVisible:
    text: "Claim"
